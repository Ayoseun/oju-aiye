app:
  environment: production
  log_level: info
  http_port: 8080

research:
  max_concurrent_jobs: 2
  max_hypotheses_per_job: 20
  max_iterations_per_hypothesis: 4
  max_agent_retries: 2
  job_timeout_seconds: 1800
  require_reviewer_before_validation: true

validation:
  enabled: true
  network_access: disabled
  max_runtime_seconds: 120
  max_memory_mb: 1024
  max_cpu_seconds: 60
  max_processes: 64
  max_artifact_mb: 100

models:
  scout:
    adapter: openai-compatible
    model_id: huihui_ai/qwen2.5-coder-7b-instruct-abliterated
    base_url: http://ollama:11434/v1
    timeout_seconds: 180
    max_output_tokens: 3000
    temperature: 0.1

  investigator:
    adapter: openai-compatible
    model_id: huihui_ai/qwen2.5-coder-7b-instruct-abliterated
    base_url: http://ollama:11434/v1
    timeout_seconds: 240
    max_output_tokens: 4000
    temperature: 0.1

  reviewer:
    adapter: openai-compatible
    model_id: huihui_ai/qwen2.5-coder-7b-instruct-abliterated
    base_url: http://ollama:11434/v1
    timeout_seconds: 240
    max_output_tokens: 3000
    temperature: 0.1

storage:
  postgres_dsn_env: DATABASE_URL
  artifact_backend: local
  artifact_directory: /app/var/artifacts
