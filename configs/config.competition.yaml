# Profile for a live bug bounty audit competition.
#
#   make run-api-competition                       # API on :8080
#   SCOPE=path/to/scope.yaml scripts/audit.sh /path/to/repo
#
# The differences from the default profile are all about scale: a competition target is
# thousands of files, so the Scout reads it in batches instead of one excerpt, and the
# investigation phase is bounded so a rate-limited free model can still finish.
app:
  environment: competition
  profile: competition
  log_level: info
  http_port: 8080

research:
  max_concurrent_jobs: 1
  max_hypotheses_per_job: 8             # bounded: each hypothesis costs two more model calls
  max_iterations_per_hypothesis: 2      # one revision round at most
  max_agent_retries: 8                 # a shared free endpoint rate-limits hard
  max_batch_retries: 2                 # a flaky batch is asked again before it is lost
  max_scout_batches: 24                # a full scan of a big target takes hours on a
                                       # rate-limited endpoint; this bounds it
  agent_retry_base_seconds: 15
  agent_retry_max_seconds: 90
  scout_chunk_bytes: 40000             # one model call per batch of source; a model that
                                    # refuses a batch splits it and reads the halves
  max_file_bytes: 30000                # a bigger file is split into parts, not cut off
  agent_context_bytes: 40000           # what the Investigator and Reviewer see of the file
  job_timeout_seconds: 7200
  require_reviewer_before_validation: true

validation:
  enabled: true
  network_access: disabled
  max_runtime_seconds: 900             # a Foundry build of a large project is slow
  max_memory_mb: 4096
  max_cpu_seconds: 600
  max_processes: 128
  max_artifact_mb: 512                 # the whole repository is staged, dependencies included

models:
  scout:
    adapter: openai-compatible
    model_id: ${SCOUT_MODEL_ID:-openai-fast}
    base_url: ${SCOUT_BASE_URL:-https://text.pollinations.ai/openai}
    api_key_env: SCOUT_API_KEY
    # The free endpoint serves a reasoning model with a small output budget: without
    # this it spends the whole budget thinking and answers nothing.
    reasoning_effort: ${REASONING_EFFORT:-low}
    timeout_seconds: 600
    max_output_tokens: 2500
    temperature: 0.1
    remote: true

  investigator:
    adapter: openai-compatible
    model_id: ${INVESTIGATOR_MODEL_ID:-openai-fast}
    base_url: ${INVESTIGATOR_BASE_URL:-https://text.pollinations.ai/openai}
    api_key_env: INVESTIGATOR_API_KEY
    reasoning_effort: ${REASONING_EFFORT:-low}
    timeout_seconds: 900
    max_output_tokens: 5000
    temperature: 0.1
    remote: true

  reviewer:
    adapter: openai-compatible
    model_id: ${REVIEWER_MODEL_ID:-openai-fast}
    base_url: ${REVIEWER_BASE_URL:-https://text.pollinations.ai/openai}
    api_key_env: REVIEWER_API_KEY
    reasoning_effort: ${REASONING_EFFORT:-low}
    timeout_seconds: 900
    max_output_tokens: 4000
    temperature: 0.1
    remote: true

storage:
  postgres_dsn_env: DATABASE_URL
  artifact_backend: local
  artifact_directory: ./var/artifacts
