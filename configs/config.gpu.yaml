# Models on a GPU server you control. YOUR SOURCE CODE IS SENT TO THAT SERVER in every prompt,
# so use a machine you trust, and see the README section on running remotely safely.
#
# Nothing here has a default on purpose: set every variable (see configs/gpu.env.example) so the
# profile can never start half-configured.
#
#   source configs/gpu.env && make run-api-gpu
#
# Ollama has no authentication. Never expose its port to the internet. Reach it through an SSH
# tunnel (then use http://localhost:11434/v1 and keep `remote: true`), a WireGuard/Tailscale
# address (add allow_insecure_http: true), or an https reverse proxy that checks an API key.
app:
  environment: remote
  profile: remote-gpu
  log_level: info
  http_port: 8080

research:
  max_concurrent_jobs: 1
  max_hypotheses_per_job: 20
  max_iterations_per_hypothesis: 4
  max_agent_retries: 2
  job_timeout_seconds: 3600
  require_reviewer_before_validation: true

validation:
  enabled: true
  network_access: disabled
  max_runtime_seconds: 120
  max_memory_mb: 1024
  max_cpu_seconds: 60
  max_processes: 64
  max_artifact_mb: 100

models:
  lead:
    adapter: openai-compatible
    model_id: ${GPU_LEAD_MODEL}
    base_url: ${GPU_BASE_URL}
    api_key_env: GPU_API_KEY
    remote: true
    timeout_seconds: 120
    max_output_tokens: 2000
    temperature: 0.3

  scout:
    adapter: openai-compatible
    model_id: ${GPU_SCOUT_MODEL}
    base_url: ${GPU_BASE_URL}
    api_key_env: GPU_API_KEY
    remote: true
    timeout_seconds: 180
    max_output_tokens: 2500
    temperature: 0.1

  investigator:
    adapter: openai-compatible
    model_id: ${GPU_INVESTIGATOR_MODEL}
    base_url: ${GPU_BASE_URL}
    api_key_env: GPU_API_KEY
    remote: true
    timeout_seconds: 240
    max_output_tokens: 5000
    temperature: 0.1

  reviewer:
    adapter: openai-compatible
    model_id: ${GPU_REVIEWER_MODEL}
    base_url: ${GPU_BASE_URL}
    api_key_env: GPU_API_KEY
    remote: true
    timeout_seconds: 240
    max_output_tokens: 4000
    temperature: 0.1

storage:
  postgres_dsn_env: DATABASE_URL
  artifact_backend: local
  artifact_directory: ./var/artifacts
